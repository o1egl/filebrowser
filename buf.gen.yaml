version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/filebrowser/filebrowser/gen/proto
plugins:
  - plugin: buf.build/protocolbuffers/go:v1.28.1
    revision: 4
    out: backend/gen/proto
    opt:
      - paths=source_relative
  - plugin: buf.build/bufbuild/connect-go:v1.4.1
    out: backend/gen/proto
    opt:
      - paths=source_relative