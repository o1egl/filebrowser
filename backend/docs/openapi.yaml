openapi: 3.0.3
info:
  version: 1.0.0
  title: FileBrowser API
paths:
  /v1/files/list:
    get:
      summary: List files
      description: List files in a directory
      parameters:
        - name: volume
          in: query
          description: Volume id. If not provided, the default home volume will be used.
          required: false
          schema:
            type: integer
        - name: path
          in: query
          description: Path to the directory
          required: true
          schema:
            type: string
        - name: groupBy
          in: query
          description: Group files by a specific field
          required: false
          schema:
            $ref: '#/components/schemas/FileGroupBy'
        - name: sortBy
          in: query
          description: Sort files by a specific field
          required: false
          schema:
            $ref: '#/components/schemas/FileSortBy'
        - name: order
          in: query
          description: Sort order
          required: false
          schema:
            $ref: '#/components/schemas/SortOrder'
      responses:
        '200':
          description: A list of files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileGroup'
        default:
          description: An error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    FileGroupBy:
      type: string
      enum:
        - kind
        - modified
        - size
    FileSortBy:
      type: string
      enum:
        - name
        - size
        - modified
    SortOrder:
      type: string
      enum:
        - asc
        - desc
    FileGroup:
      type: object
      properties:
        name:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
    File:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
        modified:
          type: string
        is_dir:
          type: boolean
        permissions:
          $ref: '#/components/schemas/FilePermissions'
    FilePermissions:
      type: object
      properties:
        read:
          type: boolean
        write:
          type: boolean
        delete:
          type: boolean
        move:
          type: boolean
        share:
          type: boolean
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

